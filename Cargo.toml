[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rezmoss/Passback"
rust-version = "1.90"
publish = false

# Crypto is unusably slow unoptimized; keep deps fast in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false
