name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full suite on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - name: Feature matrix
        shell: bash
        run: |
          cargo build -p passback --locked --no-default-features
          cargo build -p passback --locked --features full
      - name: Binary self-test
        shell: bash
        run: cargo run -p passback --locked --release -- security

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories bans licenses sources
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98.1"
      - name: No networking code in the binary
        run: ./scripts/check-no-network.sh

  fuzz:
    runs-on: ubuntu-24.04
    env:
      # cargo-fuzz needs nightly; override the pinned stable in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Seed corpus
        run: cargo test -p passback-testkit --test robustness -- --ignored write_fuzz_seed
      - name: Fuzz each target (2 minutes each)
        working-directory: fuzz
        run: |
          for t in decoders sealed_open vault_file; do
            mkdir -p corpus/$t
            cargo fuzz run $t corpus/$t -- -max_total_time=120 -rss_limit_mb=4096
          done

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify ProVerif models
        run: ./formal/verify.sh

  dco:
    # Every commit in a pull request needs a Developer Certificate of Origin sign-off.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qixF "Signed-off-by: $author"; then
              echo "::error::$c ($author) is missing 'Signed-off-by: $author'. Use git commit -s."
              fail=1
            fi
          done
          exit $fail
