name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this touch secrets, keys, sharing, sync, the network or the vault format? What could go wrong?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or how other tools do it
