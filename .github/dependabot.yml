version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rustcrypto:
        patterns: ["aead", "argon2", "chacha20poly1305", "ed25519-dalek", "x25519-dalek", "hkdf", "hmac", "ml-dsa", "ml-kem", "sha2", "sha3", "subtle", "zeroize", "getrandom"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
