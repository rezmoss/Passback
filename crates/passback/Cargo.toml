[package]
name = "passback"
description = "Passback: open-source password and secrets manager. One binary: CLI, local service with web UI, or server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "passback"
path = "src/main.rs"

[features]
default = ["cli"]
# Terminal interface. Always useful; listed so minimal builds can be explicit.
cli = []
# Later phases. Each one compiles its code in only when enabled, so a hardened
# build can leave out whole subsystems. They add no code yet.
daemon = []
web-ui = ["daemon"]
server = []
browser = ["daemon"]
agent = ["daemon"]
full = ["cli", "daemon", "web-ui", "server", "browser", "agent"]

[dependencies]
passback-crypto = { path = "../passback-crypto" }
passback-format = { path = "../passback-format" }
passback-harden = { path = "../passback-harden" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
